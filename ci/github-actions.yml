# NetGuard security gate for GitHub Actions.
# Copy to .github/workflows/netguard.yml in the repository you want to protect.
name: NetGuard
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write   # upload SARIF to GitHub code scanning

jobs:
  security-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install NetGuard CLI
        run: pip install "git+https://github.com/Flotrpy/NetGuard.git#subdirectory=backend"
      - name: "Scan (fails per .netguard/policy.json; default: Critical, new High, secrets)"
        run: |
          netguard-cli scan . \
            --policy .netguard/policy.json \
            --baseline .netguard/baseline.json \
            --format sarif -o netguard.sarif
        # Add --strict to also fail when vulnerability data (OSV.dev) was unreachable.
      - name: Upload findings to GitHub code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: netguard.sarif
